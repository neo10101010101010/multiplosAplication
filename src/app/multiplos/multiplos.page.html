<ion-header>
  <ion-toolbar>
    <ion-title>Calculadora de Múltiplos</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Ingresa un número</ion-label>
    <ion-input type="number" [(ngModel)]="numero"></ion-input>
  </ion-item>
  <ion-button expand="full" (click)="calcularMultiplos()">Calcular Múltiplos</ion-button>
  <div *ngIf="numero !== undefined && numero >= 0">
    <h2>Resultado:</h2>
    <div *ngFor="let divisor of [3, 5, 7]">
      <p [style.color]="divisor === 3 ? 'green' : divisor === 5 ? 'red' : 'blue'">
        {{ numero }} [{{ divisor }}] ({{ multiples[divisor].join(', ') }})
      </p>
    </div>
  </div>
</ion-content>
